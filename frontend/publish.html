<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trending Products — Criar publicação</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
    <strong>Trending Products</strong>
    <nav>
        <a href="index.html">Voltar</a>
        <a href="#" id="logoutLink">Sair</a>
    </nav>
</header>

<main>
    <div id="message"></div>

    <div class="card">
        <h2>Publicar novo produto</h2>
        <div class="form-group">
            <label for="name">Nome</label>
            <input type="text" id="name" />
        </div>
        <div class="form-group">
            <label for="description">Descrição</label>
            <textarea id="description" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="price">Preço (R$)</label>
            <input type="number" id="price" step="0.01" min="0" />
        </div>
        <div class="form-group">
            <label for="imageUrl">URL da imagem</label>
            <input type="text" id="imageUrl" placeholder="https://..." />
        </div>
        <button id="publishBtn">Publicar</button>
    </div>
</main>

<script src="js/app.js"></script>
<script>
    if (!Auth.isLogged()) {
        window.location.href = "login.html";
    }

    const messageEl = document.getElementById("message");

    function showMessage(msg, type = "success") {
        messageEl.innerHTML = `<div class="message ${type}">${msg}</div>`;
    }

    document.getElementById("publishBtn").addEventListener("click", async () => {
        const product = {
            name: document.getElementById("name").value.trim(),
            description: document.getElementById("description").value.trim(),
            price: parseFloat(document.getElementById("price").value),
            imageUrl: document.getElementById("imageUrl").value.trim()
        };
        try {
            await Api.publishProduct(product);
            showMessage(`Produto "${product.name}" publicado com sucesso.`);
            document.getElementById("name").value = "";
            document.getElementById("description").value = "";
            document.getElementById("price").value = "";
            document.getElementById("imageUrl").value = "";
        } catch (e) {
            showMessage(e.message, "error");
        }
    });

    document.getElementById("logoutLink").addEventListener("click", (e) => {
        e.preventDefault();
        Auth.clear();
        window.location.href = "login.html";
    });
</script>
</body>
</html>
