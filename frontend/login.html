<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trending Products — Entrar</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
    <strong>Trending Products</strong>
</header>

<main>
    <div id="message"></div>

    <div class="card">
        <h2>Entrar</h2>
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" placeholder="ex: luciano" />
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" />
        </div>
        <button id="loginBtn">Entrar</button>
        <button id="registerBtn" style="background:#6b7280; margin-left:8px;">Criar conta</button>
    </div>
</main>

<script src="js/app.js"></script>
<script>
    const messageEl = document.getElementById("message");

    function showMessage(msg, type = "success") {
        messageEl.innerHTML = `<div class="message ${type}">${msg}</div>`;
    }

    // Se já estiver logado, não faz sentido ficar na tela de login.
    if (Auth.isLogged()) {
        window.location.href = "index.html";
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        try {
            const { token } = await Api.login(username, password);
            Auth.saveToken(token);
            window.location.href = "index.html";
        } catch (e) {
            showMessage(e.message, "error");
        }
    });

    document.getElementById("registerBtn").addEventListener("click", async () => {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        try {
            await Api.register(username, password);
            showMessage("Conta criada! Agora faça login.");
        } catch (e) {
            showMessage(e.message, "error");
        }
    });
</script>
</body>
</html>
